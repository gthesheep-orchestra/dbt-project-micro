[project]
name = "warehouse-types"
version = "0.1.0"
description = "A dbt project that creates a single-row table of every native data type for your warehouse"
requires-python = ">=3.10"
 
[dependency-groups]
core       = ["dbt-core"]
bigquery   = ["dbt-bigquery"]
snowflake  = ["dbt-snowflake"]
databricks = ["dbt-databricks"]
motherduck = ["dbt-duckdb"]
sync       = ["google-cloud-bigquery>=3.0", "beautifulsoup4>=4.12", "requests>=2.31", "pyyaml>=6.0", "duckdb>=1.0"]
all        = [
    "dbt-bigquery",
    "dbt-snowflake",
    "dbt-databricks",
    "dbt-duckdb",
    "google-cloud-bigquery>=3.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pyyaml>=6.0",
    "duckdb>=1.0",
]

[tool.uv]
default-groups = ["core", "bigquery"]
# This is a dbt project, not an installable library — don't try to build/install
# it as a package. Without this, `uv pip install .` (and plain `pip install .`)
# fail with a setuptools "Multiple top-level packages discovered in a
# flat-layout" error, because it tries to auto-package data/, models/, macros/.
package = false
