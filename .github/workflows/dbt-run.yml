name: dbt run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Warehouse to run against
        required: true
        default: bigquery
        type: choice
        options: [bigquery, snowflake, databricks, motherduck]

jobs:
  dbt-run:
    runs-on: ubuntu-latest

    # On push/PR: run every warehouse across every Python version currently
    # supported by dbt-core's Active/Critical releases (1.12 and 1.11 both
    # cover 3.10-3.13 — see https://docs.getdbt.com/faqs/Core/install-python-compatibility).
    # On manual dispatch: run only the chosen warehouse, still across all
    # four Python versions.
    #
    # fail-fast is off so one failing combo doesn't cancel the rest of the
    # matrix — with 16 combos we want the full picture, not just the first
    # failure.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch'
          && fromJson(format('["{0}"]', inputs.target))
          || fromJson('["bigquery", "snowflake", "databricks", "motherduck"]') }}
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dbt
        run: uv sync --python "${{ matrix.python-version }}" --group core --group "${{ matrix.target }}"

      - name: Authenticate BigQuery
        if: matrix.target == 'bigquery'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: dbt run — ${{ matrix.target }} (Python ${{ matrix.python-version }})
        env:
          # BigQuery
          BQ_PROJECT:  ${{ vars.BQ_PROJECT }}
          BQ_DATASET:  ${{ vars.BQ_DATASET }}
          # Snowflake
          SNOWFLAKE_ACCOUNT:   ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA:    ${{ vars.SNOWFLAKE_SCHEMA }}
          # Databricks
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN:     ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG:   ${{ vars.DATABRICKS_CATALOG }}
          DATABRICKS_SCHEMA:    ${{ vars.DATABRICKS_SCHEMA }}
          # MotherDuck — token is read automatically from MOTHERDUCK_TOKEN
          MOTHERDUCK_TOKEN:    ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ vars.MOTHERDUCK_DATABASE }}
        run: |
          uv run dbt run --target ${{ matrix.target }} --profiles-dir .
